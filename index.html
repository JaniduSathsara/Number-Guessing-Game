<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>


    <link rel="stylesheet" href="CSS/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>


</head>

<body>
    <div class="card container">
        <div class="card-body">
            <div class="text-center mb-4">
                <h1>🎯</h1>
                <h4">Number Guessing Game</h4>
                    <p class="text-secondary mb-0">Think you're a genius? Prove it!sss</p>
            </div>
            <hr>
            <h5 class="text-center">Guess the Secret Number</h5>
            <p class="text-center">Enter a number between 1 and 10</p>
            <div>
                <hr>
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input type="text"
                    id="userNumber" placeholder="Enter your number...">
                <input class="btn-outline theme-info btn btn-primary px-4 btn" type="button" value="Guess"
                    onclick="btnGuessClick()" id="lblBtnGues">
                <input id="btnRefresh" class="btn-outline theme-warning btn" type="button" value="↺" onclick="tryAgain()">
            </div>
            <hr>
            <div class="text-center">Good Luck! 🍀</div>
            <hr>
            <div class="text-center">
                <small class="text-muted">© 2026 Number Guessing Game</small>
            </div>
        </div>
    </div>
    <div class="container">
        <hr>
        <div class="card container">
            <div class="card-header">
                History
            </div>
            <div class="card-body">
                <figure>
                    <blockquote class="blockquote">
                        <p id="lblHistory"></p>
                    </blockquote>
                    <figcaption class="blockquote-footer">
                        Your Guess History
                    </figcaption>
                </figure>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>
</body>

</html>
