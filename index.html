<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>


</head>

<body>

    <div class="card">

        <div class="card-body">
            <div class="text-center mb-4">
                <h1>🎯</h1>
                <h4">Number Guessing Game</h4>
                    <p class="text-secondary mb-0">
                        Think you're a genius? Prove it!
                    </p>
            </div>
            <hr>
            <h5>
                Guess the Secret Number</h5>

            <p>Enter a number between 1 and 10</p>
            <div>
                <input type="text" id="userNumber" placeholder="Enter your number...">
                <input class="btn-outline theme-info btn btn-primary px-4" type="button" value="Guess"
                    onclick="btnGuessClick()">
                <input id="btnRefresh" class="btn-outline theme-warning" type="button" value="↺" onclick="tryAgain()">
            </div>
            <hr>
            <div>
                Good Luck! 🍀
            </div>
            <hr>
            <div id="results">


            </div>

            <hr>

            <div class="text-center">
                <small class="text-muted">© 2026 Number Guessing Game</small>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
